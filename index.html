function roleSync(){let u=user();$('sideName').textContent=db.activeRole==='admin'?'Кирилл · Администратор':(u?.name||'Покупатель');$('sideRole').textContent=db.activeRole==='admin'?'Полный доступ · Demo':(u?.email||'Клиент');$('sideAvatar').textContent=db.activeRole==='admin'?'К':initials(u?.name||'К');$('profileShortcut').title=db.activeRole==='admin'?'Профиль администратора (демо)':'Открыть мой профиль';$('profileShortcut').style.cursor=db.activeRole==='client'?'pointer':'default';$('profileTop').classList.toggle('hidden',db.activeRole!=='client');$('adminNav').classList.toggle('hidden',db.activeRole!=='admin');$('clientNav').classList.toggle('hidden',db.activeRole!=='client');$('switchAccount').textContent=db.activeRole==='admin'?'Перейти в кабинет клиента ↗':'Вернуться в аккаунт администратора ↗';let n=db.requests.filter(r=>r.managerRequested&&!r.managerSeen).length;$('navUnread').textContent=n;$('navUnread').classList.toggle('hidden',!n)}
function setRole(role){db.activeRole=role;save();roleSync();showView(role==='admin'?'dashboard':'clientHome')}
function showView(view){roleSync();document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));let root=$('viewRoot');let titles={dashboard:'Обзор',catalog:'Каталог недвижимости',inbox:'Обращения клиентов',adminChats:'Сообщения',pipeline:'Сделки',clientHome:'Мой профиль',myRequests:'Мои заявки',clientChat:'AI-помощник и менеджер'};$('crumb').textContent=(db.activeRole==='admin'?'Рабочее пространство':'Личный кабинет')+' / '+(titles[view]||'');if(view==='dashboard')root.innerHTML=adminDashboard();else if(view==='catalog')root.innerHTML=catalogView();else if(view==='inbox')root.innerHTML=inboxView();else if(view==='adminChats')root.innerHTML=adminChatsView();else if(view==='pipeline')root.innerHTML=pipelineView();else if(view==='clientHome')root.innerHTML=clientHome();else if(view==='myRequests')root.innerHTML=myRequestsView();else if(view==='clientChat')root.innerHTML=clientChatView();else root.innerHTML=adminDashboard();bindView(view)}
function adminDashboard(){let pending=db.requests.filter(r=>r.managerRequested&&!r.managerSeen).length;return `<div class="hero"><div><div class="eyebrow">Maison Intelligence · Control room</div><h1>Ваше пространство<br>управления.</h1><p>Клиенты, объекты и переговоры в единой системе.</p></div><div class="date">SIGNATURE ADMIN · DEMO</div></div><div class="stats"><div class="stat"><div class="stat-top">Объекты в каталоге <span>↗</span></div><strong>${properties.length}</strong><div class="trend">Демонстрационная подборка</div></div><div class="stat"><div class="stat-top">Заявки клиентов <span>♙</span></div><strong>${db.requests.length}</strong><div class="trend">Все обращения</div></div><div class="stat"><div class="stat-top">Нужен менеджер <span>✉</span></div><strong>${pending}</strong><div class="trend">Ожидают ответа</div></div><div class="stat"><div class="stat-top">Зарегистрировано <span>◎</span></div><strong>${db.users.length}</strong><div class="trend">Клиентские аккаунты</div></div></div><div class="grid"><section class="panel assistant"><div class="panelhead"><h2>AI-ассистент агентства</h2><span class="tag">● ГОТОВ К РАБОТЕ</span></div><div class="hello"><div class="aiicon">✧</div><div class="bubble"><b>Здравствуйте, Кирилл.</b><br>Здесь вы управляете обращениями покупателей. Новые запросы на связь с менеджером появятся в разделе «Клиенты».</div></div><div class="prompts"><button class="prompt" data-go="inbox">Открыть обращения</button><button class="prompt" data-go="catalog">Посмотреть каталог</button><button class="prompt" data-go="adminChats">Личные сообщения</button></div><div class="hint">Демо-режим · Данные сохраняются локально в этом браузере</div></section><section class="panel sidepanel"><h2>Центр обращений</h2><div class="metric"><span>Всего заявок</span><strong>${db.requests.length}</strong></div><div class="metric"><span>Запросили менеджера</span><strong>${db.requests.filter(r=>r.managerRequested).length}</strong></div><div class="metric"><span>Менеджер подключён</span><strong>${db.requests.filter(r=>r.managerActive).length}</strong></div><div class="metric"><span>Клиентские аккаунты</span><strong>${db.users.length}</strong></div></section></div><section class="section"><div class="sectionhead"><div><div class="eyebrow">Нуждаются во внимании</div><h2>Новые обращения</h2></div><button class="btn" data-go="inbox">Все клиенты ↗</button></div>${pending?db.requests.filter(r=>r.managerRequested&&!r.managerSeen).slice(0,3).map(requestCard).join(''):'<div class="panel" style="padding:18px;color:var(--muted);font-size:12px">Пока нет новых запросов на связь с менеджером.</div>'}</section>`}
function catalogView(){let client=db.activeRole==='client';return `<div class="hero"><div><div class="eyebrow">Private collection</div><h1>Недвижимость<br>с характером.</h1><p>Подборка объектов MAISON AI Signature.</p></div><div class="date">${properties.length} SELECTED PROPERTIES</div></div><div class="filters"><input id="searchProperty" placeholder="Поиск по названию или району…"><select id="typeFilter"><option value="">Все типы</option><option>Апартаменты</option><option>Вилла</option><option>Загородный дом</option></select></div><div class="properties" id="propertyGrid">${properties.map(propertyCard).join('')}</div>`}
function propertyCard(p){let fav=(db.favorites[db.activeUser]||[]).includes(p.id);return `<article class="panel property" data-property="${p.id}"><div class="photo"><img src="${p.image}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='assets/modern-villa.webp'"><span class="label">${esc(p.tag)}</span>${db.activeRole==='client'?`<button class="heart" data-fav="${p.id}" aria-label="В избранное">${fav?'♥':'♡'}</button>`:''}</div><div class="pbody"><div class="pprice">${p.price}</div><div class="pname">${esc(p.name)}</div><div class="pmeta"><span>${p.area}</span><span>${p.rooms}</span><span>${esc(p.place)}</span></div></div></article>`}
function requestCard(r){let u=db.users.find(x=>x.id===r.userId)||{};let p=properties.find(x=>x.id===r.propertyId)||{};return `<div class="inbox-card" data-open-request="${r.id}"><div><strong>${esc(u.name||r.name||'Клиент')} · ${esc(p.name||r.propertyName||'Запрос на подбор')}</strong><p>${esc(u.email||r.email||'')} · ${esc(u.phone||r.phone||'')} · ${esc(r.created||'')}</p><p>${r.managerRequested?'Просит связать с менеджером':'Заявка на объект'}${r.managerActive?' · Менеджер подключён':''}</p></div><span class="badge ${r.managerRequested&&!r.managerSeen?'alert':''}">${r.managerRequested&&!r.managerSeen?'Новый запрос':'Открыть'}</span></div>`}
function inboxView(){let rs=[...db.requests].reverse();return `<div class="hero"><div><div class="eyebrow">Client relations</div><h1>Обращения<br>и покупатели.</h1><p>Откройте карточку клиента, чтобы посмотреть данные и историю диалога.</p></div></div><div class="panel" style="padding:17px"><div class="panelhead"><h2>Входящие обращения</h2><span class="tag">${rs.length} ВСЕГО</span></div>${rs.length?rs.map(requestCard).join(''):'<p class="muted">Пока обращений нет. Создайте тестовую заявку из клиентского аккаунта.</p>'}</div>`}
function adminChatsView(){let rs=db.requests.filter(r=>r.managerRequested);return `<div class="hero"><div><div class="eyebrow">Direct conversations</div><h1>Личные<br>переписки.</h1><p>Диалоги открываются после запроса клиента на связь с менеджером.</p></div></div><div class="panel" style="padding:17px">${rs.length?rs.map(r=>{let u=db.users.find(x=>x.id===r.userId)||{};return `<div class="inbox-card" data-open-request="${r.id}"><div><strong>${esc(u.name||'Клиент')}</strong><p>${esc(u.email||'')} · ${r.managerActive?'Менеджер подключён':'Ожидает первого сообщения менеджера'}</p></div><span class="badge">Открыть чат ↗</span></div>`}).join(''):'<p class="muted">Пока нет диалогов. Сначала клиент должен попросить связать его с менеджером в AI-чате.</p>'}</div>`}
function pipelineView(){let ds=[...db.requests].filter(r=>r.deal).reverse();return `<div class="hero"><div><div class="eyebrow">Sales pipeline</div><h1>Сделки<br>и оформление.</h1><p>Заявки клиентов, ожидающие подтверждения и одобренные сделки.</p></div></div><div class="stats"><div class="stat"><div class="stat-top">Всего сделок</div><strong>${ds.length}</strong></div><div class="stat"><div class="stat-top">Ожидают подтверждения</div><strong>${ds.filter(r=>r.deal.status!=='approved').length}</strong></div><div class="stat"><div class="stat-top">Одобрено</div><strong>${ds.filter(r=>r.deal.status==='approved').length}</strong></div><div class="stat"><div class="stat-top">Клиентские аккаунты</div><strong>${db.users.length}</strong></div></div><div class="panel" style="padding:18px"><div class="panelhead"><h2>Реестр сделок</h2><span class="tag">${ds.length} ЗАПИСЕЙ</span></div>${ds.length?ds.map(r=>{let u=db.users.find(x=>x.id===r.userId)||{},p=properties.find(x=>x.id===r.propertyId)||{};return `<div class="request-card"><div class="panelhead"><h2>${esc(p.name||'Объект недвижимости')}</h2><span class="deal-state ${r.deal.status==='approved'?'approved':'pending'}">${r.deal.status==='approved'?'Одобрена':'Ожидает подтверждения'}</span></div><p><b>${esc(u.name||'Клиент')}</b> · ${esc(u.phone||'')} · ${esc(u.email||'')}</p><p>${esc(p.price||'Стоимость уточняется')} · ${esc(p.place||'')}</p><p>Плательщик: ${esc(r.deal.payer||u.name||'Не указан')} · Способ: ${esc(r.deal.paymentMethod||'Демо')}</p>${r.deal.note?`<p>Комментарий: ${esc(r.deal.note)}</p>`:''}<p>Заявка: ${esc(r.deal.created||r.created||'')} · Демонстрационный режим</p><div class="deal-actions"><button class="btn" data-open-request="${r.id}">Карточка клиента</button>${r.deal.status!=='approved'?`<button class="btn primary" data-approve-deal="${r.id}">Заключить сделку ↗</button>`:'<span class="deal-state approved">Клиент уведомлён</span>'}</div></div>`}).join(''):'<p class="muted">Пока сделок нет. Клиент может написать в AI-чате «Я готов к сделке», после чего здесь появится заявка на оформление.</p>'}</div>`}
function clientHome(){let u=user();if(!u)return loginView();let req=db.requests.filter(r=>r.userId===u.id);return `<div class="hero"><div><div class="eyebrow">Private client space</div><h1>Добро пожаловать,<br>${esc(u.name.split(' ')[0])}.</h1><p>Ваш персональный кабинет MAISON AI Signature.</p></div><div class="date">CLIENT ACCOUNT</div></div><div class="stats"><div class="stat"><div class="stat-top">Мои заявки</div><strong>${req.length}</strong><div class="trend">История обращений</div></div><div class="stat"><div class="stat-top">Избранное</div><strong>${(db.favorites[u.id]||[]).length}</strong><div class="trend">Сохранённые объекты</div></div><div class="stat"><div class="stat-top">Переписки</div><strong>${req.filter(r=>r.managerActive).length}</strong><div class="trend">С менеджером</div></div><div class="stat"><div class="stat-top">Статус профиля</div><strong style="font-size:18px">Активен</strong><div class="trend">Данные сохранены</div></div></div><div class="client-layout"><section class="panel client-menu"><h3 style="font:normal 18px Georgia,serif">Мой кабинет</h3><button class="active" data-go="clientHome">Мой профиль</button><button data-go="myRequests">Мои заявки</button><button data-go="clientChat">AI-помощник и чат</button><button data-go="catalog">Каталог недвижимости</button></section><section class="panel client-content"><div class="panelhead"><h2>Ваш профиль</h2><span class="tag">ПОКУПАТЕЛЬ</span></div><div class="metric"><span>Имя</span><strong>${esc(u.name)}</strong></div><div class="metric"><span>Email</span><strong>${esc(u.email)}</strong></div><div class="metric"><span>Телефон</span><strong>${esc(u.phone)}</strong></div><div class="notice">AI-помощник доступен круглосуточно. Для начала оформления напишите в чате «Я готов к сделке». Помощник объяснит дальнейшие шаги.</div><div class="profile-actions"><button class="btn primary" id="editProfile">Редактировать профиль</button><button class="btn" data-go="clientChat">Открыть чат ↗</button><button class="btn danger" id="deleteAccount">Удалить аккаунт</button></div></section></div>`}
function myRequestsView(){let u=user();if(!u)return loginView();let rs=[...db.requests].filter(r=>r.userId===u.id).reverse();return `<div class="hero"><div><div class="eyebrow">My requests</div><h1>Мои заявки.</h1><p>Все отправленные запросы и их текущий статус.</p></div><button class="btn primary" data-go="catalog">Выбрать объект ↗</button></div>${rs.length?rs.map(r=>{let p=properties.find(x=>x.id===r.propertyId)||{};return `<div class="request-card"><h4>${esc(p.name||r.propertyName)}</h4><p>${esc(p.place||'Подбор недвижимости')} · ${esc(p.price||'')}</p><p>Статус: ${r.deal?.status==='approved'?'Сделка одобрена':r.deal?'Ожидает подтверждения менеджера':r.managerActive?'Менеджер подключён':r.managerRequested?'Ожидает менеджера':'AI-консультация'}</p><button class="btn small" data-go="clientChat">Перейти в чат ↗</button></div>`}).join(''):'<div class="panel" style="padding:20px"><p class="muted">У вас пока нет заявок. Откройте каталог и выберите понравившийся объект.</p><button class="btn primary" data-go="catalog">Открыть каталог</button></div>'}`}
function loginView(){return `<div class="loginwrap"><section class="panel loginpanel"><div class="eyebrow">Maison AI Signature</div><h2>Вход в кабинет</h2><p>Войдите в аккаунт покупателя или создайте новый профиль.</p><div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="name@example.com"></div><div class="field"><label>Пароль</label><input id="loginPassword" type="password" placeholder="Ваш пароль"></div><div class="modalactions"><button class="btn primary" id="loginBtn">Войти</button><button class="btn" id="registerOpen">Регистрация</button></div><div class="notice">Для проверки административной части используйте переключатель аккаунта в верхней панели. Это демонстрационный вход, не защищённая авторизация.</div></section></div>`}
function clientChatView(){let u=user();if(!u)return loginView();let rs=db.requests.filter(r=>r.userId===u.id);let r=rs[rs.length-1];if(!r){return `<div class="hero"><div><div class="eyebrow">AI concierge</div><h1>Ваш помощник<br>по недвижимости.</h1><p>Сначала выберите объект или отправьте заявку, чтобы начать диалог.</p></div></div><button class="btn primary" data-go="catalog">Открыть каталог ↗</button>`}return `<div class="hero"><div><div class="eyebrow">Private conversation</div><h1>Ваш диалог.</h1><p>Сначала отвечает AI. Для оформления напишите «Я готов к сделке».</p></div><span class="badge ${r.managerActive?'':'alert'}">${r.managerActive?'Менеджер подключён':r.managerRequested?'Ожидаем менеджера':'AI-помощник активен'}</span></div><section class="panel assistant"><div class="panelhead"><h2>${esc(properties.find(p=>p.id===r.propertyId)?.name||'Консультация')}</h2><span class="tag">${r.managerActive?'DIRECT CHAT':'AI CONCIERGE'}</span></div><div class="chat-switch"><button class="active">AI-помощник</button>${r.managerActive?'<button class="active">Личный чат с менеджером</button>':'<button disabled>Чат с менеджером · после подключения</button>'}</div><div class="chatlog" id="chatLog">${renderMessages(r.id)}</div><form class="composer" id="clientChatForm"><input id="chatInput" placeholder="Напишите вопрос или попросите менеджера…" autocomplete="off"><button class="send">Отправить ↗</button></form><div class="hint">${r.deal?.status==='approved'?'Сделка одобрена менеджером.':'Я подскажу следующие шаги. Фраза «Я готов к сделке» запускает демонстрационное оформление.'}</div></section>`}
function renderMessages(id){let msgs=db.messages[id]||[];if(!msgs.length)return `<div class="msg ai">Здравствуйте! Я ваш AI-консультант MAISON. Могу рассказать об объекте, уточнить характеристики и помочь с дальнейшими шагами.</div>`;return msgs.map(m=>`<div class="msg ${m.from==='client'?'user':m.from==='manager'?'manager':'ai'}">${esc(m.text)}<small>${m.from==='client'?'Вы':m.from==='manager'?'Менеджер':'AI-помощник'} · ${esc(m.time||'')}</small></div>`).join('')}
function managerIntent(s){return /(хочу|нужно|можно|могу|жел|попрос|свяж|соедин|направ|позов|поговор|общаться|связаться).{0,55}(менеджер|специалист|человек|сотрудник|консультант)|(менеджер|специалист|человек|сотрудник|консультант).{0,55}(поговор|связ|позов|направ|соедин|общаться)|жив(ой|ого) консультант|не хочу общаться с ботом|позовите человека/i.test(s)}
function aiAnswer(s,r){let q=s.toLowerCase(),p=properties.find(x=>x.id===r.propertyId)||{};if(/^(привет|здравствуй|добрый|доброе|добрый вечер|хай)/.test(q))return 'Здравствуйте! Рада помочь. Уже присмотрели конкретный объект или пока выбираете? Можем спокойно обсудить цену, планировку, район и дальнейшие шаги.';if(/цен|стоим|сколько|бюджет/.test(q))return `Стоимость выбранного объекта ${p.name?'«'+p.name+'»':''}: ${p.price||'уточняется'}. Если хотите, подберу ещё несколько вариантов в похожем бюджете.`;if(/площад|метр|м²|комнат|планиров/.test(q))return `У этого объекта ${p.area||'площадь уточняется'}, планировка: ${p.rooms||'уточняется'}. Могу также рассказать о расположении и особенностях объекта.`;if(/ипотек|рассроч|оплат|платеж/.test(q))return 'Варианты оплаты и финансирования зависят от объекта и условий банка. Я не буду обещать одобрение заранее, но могу передать вопрос менеджеру, чтобы он уточнил возможные сценарии.';if(/просмотр|посмотр|встрет|приехат/.test(q))return 'Конечно, просмотр можно согласовать. Напишите, в какие дни вам удобно и в какое время, я передам пожелания менеджеру.';if(/друг|альтернатив|подбор|вариант|семь|ребен|семь[яи]/.test(q))return 'Давайте подберём что-то подходящее. Что для вас важнее всего: район, количество комнат, площадь или бюджет? Можно открыть каталог и сравнить все 12 объектов.';if(/документ|договор|оформ|сделк/.test(q))return 'Обычно перед сделкой согласуют объект и цену, проверяют документы и полномочия сторон, фиксируют условия, затем подписывают необходимые документы. Конкретный перечень зависит от типа недвижимости. Менеджер поможет пройти каждый этап.';if(/торг|скидк|дешев/.test(q))return 'Понимаю, хочется получить лучшие условия. Размер возможного торга зависит от продавца и ситуации по объекту. Могу передать менеджеру пожелание по цене.';if(/менеджер|человек|специалист|консультант/.test(q))return 'Конечно, подключим специалиста. Напишите «Хочу поговорить с менеджером», и обращение появится в его рабочем кабинете.';if(/спасибо|благодар/.test(q))return 'Пожалуйста! Я рядом, если появятся вопросы. Можем продолжить подбор или перейти к следующему шагу.';if(/готов|покуп|беру|оформить/.test(q))return 'Если вы уже определились, напишите точную фразу «Я готов к сделке». Я покажу порядок оформления и передам заявку менеджеру на подтверждение.';return `Поняла вас. По объекту «${p.name||'из нашего каталога'}» могу помочь с характеристиками, стоимостью, расположением и порядком оформления. Расскажите, что для вас сейчас самое важное?`}
function addMessage(id,from,text){if(!db.messages[id])db.messages[id]=[];db.messages[id].push({from,text,time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});save()}
function sendClientMessage(text){let u=user();let r=[...db.requests].filter(x=>x.userId===u.id).pop();if(!r)return;addMessage(r.id,'client',text);if(/я\s+готов\s+к\s+сделке|готов\s+к\s+сделке/i.test(text)){r.dealIntent=true;addMessage(r.id,'ai','Отлично, тогда перейдём к оформлению. Важно: это демонстрационный сценарий, реальные деньги не списываются. Сейчас открою форму заявки, а после отправки менеджер увидит её в разделе «Сделки» и сможет подтвердить оформление.');save();showView('clientChat');openPaymentModal(r.id);return;}if(managerIntent(text)){r.managerRequested=true;r.managerSeen=false;addMessage(r.id,'ai','Конечно, передаю обращение менеджеру. Он увидит историю нашего разговора и сможет продолжить общение здесь.');toast('Запрос менеджеру отправлен');}else if(r.managerActive){addMessage(r.id,'ai','Сообщение доставлено менеджеру. Он увидит его в своей CRM.');}else{addMessage(r.id,'ai',aiAnswer(text,r));}save();showView('clientChat')}
function openRequest(id){let r=db.requests.find(x=>x.id===id);if(!r)return;r.managerSeen=true;save();let u=db.users.find(x=>x.id===r.userId)||{};let p=properties.find(x=>x.id===r.propertyId)||{};openModal(`<div class="modalhead"><h2>Карточка покупателя</h2><button class="close" data-close>×</button></div><div class="notice">${r.managerRequested?'Клиент запросил связь с менеджером.':'Заявка на объект недвижимости.'}</div><div class="detail-grid"><div class="detail-stat"><b>${esc(u.name||r.name)}</b><span>Имя клиента</span></div><div class="detail-stat"><b>${esc(u.email||r.email)}</b><span>Email</span></div><div class="detail-stat"><b>${esc(u.phone||r.phone)}</b><span>Телефон</span></div></div><div class="request-card"><h4>${esc(p.name||r.propertyName)}</h4><p>${esc(p.place||'')}</p><p>${esc(p.price||'')}</p></div><h3 style="font:normal 17px Georgia,serif">История переписки</h3><div class="chatlog" style="margin:0;max-height:220px">${renderMessages(r.id)}</div><div class="modalactions"><button class="btn" data-close>Закрыть</button>${r.deal&&r.deal.status!=='approved'?`<button class="btn gold" data-approve-deal="${r.id}">Заключить сделку ↗</button>`:''}<button class="btn primary" id="replyToClient" data-id="${r.id}">${r.managerActive?'Открыть чат':'Подключиться и написать клиенту'} ↗</button></div>`);roleSync()}
function openManagerChat(id){let r=db.requests.find(x=>x.id===id);if(!r)return;r.managerActive=true;r.managerRequested=true;save();openModal(`<div class="modalhead"><h2>Личный чат с клиентом</h2><button class="close" data-close>×</button></div><div class="notice">Менеджер подключён. Теперь клиент увидит возможность личной переписки в своём кабинете.</div><div class="chatlog" id="managerChatLog" style="margin:0;max-height:320px">${renderMessages(id)}</div><form class="composer" id="managerReplyForm" style="margin:12px 0 0"><input id="managerReply" placeholder="Напишите клиенту…"><button class="send">Отправить ↗</button></form>`);$('managerReplyForm').addEventListener('submit',e=>{e.preventDefault();let t=$('managerReply').value.trim();if(!t)return;addMessage(id,'manager',t);openManagerChat(id);toast('Сообщение отправлено клиенту')})}
function createRequest(pid){let u=user();if(!u){openModal(`<div class="modalhead"><h2>Войдите в кабинет</h2><button class="close" data-close>×</button></div><p class="muted">Чтобы оставить заявку, зарегистрируйтесь или войдите в аккаунт покупателя.</p><div class="modalactions"><button class="btn" data-close>Отмена</button><button class="btn primary" id="goLogin">Войти / регистрация</button></div>`);return}let p=properties.find(x=>x.id===pid);let r={id:'r'+Date.now(),userId:u.id,propertyId:pid,created:new Date().toLocaleString('ru-RU'),managerRequested:false,managerSeen:false,managerActive:false};db.requests.push(r);addMessage(r.id,'ai',`Спасибо за заявку на объект «${p.name}». Я ваш AI-консультант. Можете задать вопрос об объекте или попросить связать вас с менеджером.`);save();toast('Заявка отправлена');showView('clientChat')}

function openPaymentModal(id){let r=db.requests.find(x=>x.id===id);if(!r)return;let p=properties.find(x=>x.id===r.propertyId)||{};openModal(`<div class="modalhead"><h2>Заявка на оформление</h2><button class="close" data-close>×</button></div><div class="notice">Демонстрационный режим. Не вводите реальные банковские реквизиты. Оплата не производится, карта не списывается.</div><div class="request-card"><h4>${esc(p.name||'Выбранный объект')}</h4><p>${esc(p.place||'')}</p><p><b>${esc(p.price||'Стоимость уточняется')}</b></p></div><form id="paymentDemoForm"><div class="field"><label>Имя плательщика</label><input id="payerName" required value="${esc(user()?.name||'')}" placeholder="Как указано в заявке"></div><div class="field"><label>Демонстрационный способ оплаты</label><select id="demoPayment"><option>Заявка на банковский перевод</option><option>Демонстрационная банковская карта</option><option>Оплата после проверки документов</option></select></div><div class="field"><label>Комментарий менеджеру</label><textarea id="paymentNote" placeholder="Например, хочу согласовать просмотр перед оформлением"></textarea></div><div class="notice">После отправки менеджер увидит объект, клиента и сумму в разделе «Сделки». Подтверждение выполняется вручную.</div><div class="modalactions"><button type="button" class="btn" data-close>Отмена</button><button class="btn primary">Отправить заявку менеджеру ↗</button></div></form>`)}
function approveDeal(id){let r=db.requests.find(x=>x.id===id);if(!r||!r.deal)return;closeModal();r.deal.status='approved';r.deal.approvedAt=new Date().toLocaleString('ru-RU');addMessage(r.id,'manager','Ваша заявка на оформление одобрена. Менеджер подтвердил переход к следующему этапу сделки. Свяжитесь с агентством для согласования документов и безопасного расчёта.');save();toast('Сделка отмечена как одобренная');showView('pipeline')}
function editProfileModal(){let u=user();if(!u)return;openModal(`<div class="modalhead"><h2>Редактирование профиля</h2><button class="close" data-close>×</button></div><form id="profileForm"><div class="field"><label>Имя и фамилия</label><input id="profileName" required value="${esc(u.name)}"></div><div class="field"><label>Телефон</label><input id="profilePhone" required inputmode="numeric" maxlength="15" value="${esc(u.phone)}"></div><div class="field"><label>Email</label><input id="profileEmail" type="email" required value="${esc(u.email)}"></div><div class="modalactions"><button type="button" class="btn" data-close>Отмена</button><button class="btn primary">Сохранить изменения</button></div></form>`)}
function deleteAccount(){let u=user();if(!u)return;openModal(`<div class="modalhead"><h2>Удалить аккаунт?</h2><button class="close" data-close>×</button></div><p class="muted">Это действие удалит профиль, избранное, заявки и историю переписки этого покупателя из демонстрационного хранилища. Восстановить данные будет нельзя.</p><div class="modalactions"><button class="btn" data-close>Оставить аккаунт</button><button class="btn danger" id="confirmDeleteAccount">Да, удалить аккаунт</button></div>`)}
function openModal(html){$('modalRoot').innerHTML=`<div class="modalback"><div class="modal">${html}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function registerModal(){openModal(`<div class="modalhead"><h2>Создать аккаунт покупателя</h2><button class="close" data-close>×</button></div><p class="muted" style="font-size:11px">Заполните данные, чтобы сохранять объекты и общаться с агентством.</p><form id="registerForm"><div class="formgrid"><div class="field"><label>Имя и фамилия *</label><input id="regName" required placeholder="Например, Анна Смирнова"></div><div class="field"><label>Телефон *</label><input id="regPhone" required type="tel" inputmode="numeric" pattern="[0-9]{10,15}" maxlength="15" placeholder="79000000000"></div><div class="field"><label>Email *</label><input id="regEmail" type="email" required placeholder="name@gmail.com" autocomplete="email"></div><div class="field"><label>Пароль *</label><input id="regPassword" type="password" minlength="4" required placeholder="Не менее 4 символов"></div></div><div class="modalactions"><button type="button" class="btn" data-close>Отмена</button><button class="btn primary">Зарегистрироваться</button></div></form><div class="notice">Телефон: только 10–15 цифр. Email: поддерживаются распространённые домены Gmail, Яндекс, Mail.ru, Outlook, iCloud и другие.</div>`)}
function bindView(view){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.go)));document.querySelectorAll('[data-property]').forEach(c=>c.addEventListener('click',e=>{if(e.target.closest('[data-fav]'))return;showProperty(c.dataset.property)}));document.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();let id=b.dataset.fav;let a=db.favorites[db.activeUser]||[];db.favorites[db.activeUser]=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();showView('catalog')}));document.querySelectorAll('[data-open-request]').forEach(c=>c.addEventListener('click',()=>openRequest(c.dataset.openRequest)));if($('editProfile'))$('editProfile').addEventListener('click',editProfileModal);if($('deleteAccount'))$('deleteAccount').addEventListener('click',deleteAccount);if($('searchProperty')&&!$('searchProperty').dataset.bound){let f=()=>{let q=$('searchProperty').value.toLowerCase(),t=$('typeFilter').value;let list=properties.filter(p=>(!t||p.type===t)&&(`${p.name} ${p.place} ${p.type}`).toLowerCase().includes(q));$('propertyGrid').innerHTML=list.map(propertyCard).join('');document.querySelectorAll('[data-property]').forEach(c=>c.addEventListener('click',e=>{if(!e.target.closest('[data-fav]'))showProperty(c.dataset.property)}));document.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();let id=b.dataset.fav,a=db.favorites[db.activeUser]||[];db.favorites[db.activeUser]=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();showView('catalog')}))};$('searchProperty').dataset.bound='1';$('searchProperty').addEventListener('input',f);$('typeFilter').addEventListener('change',f)}if($('clientChatForm'))$('clientChatForm').addEventListener('submit',e=>{e.preventDefault();let t=$('chatInput').value.trim();if(t)sendClientMessage(t)});if($('loginBtn'))$('loginBtn').addEventListener('click',login);if($('registerOpen'))$('registerOpen').addEventListener('click',registerModal)}
function showProperty(id){let p=properties.find(x=>x.id===id);if(!p)return;openModal(`<div class="modalhead"><h2>${esc(p.name)}</h2><button class="close" data-close>×</button></div><img class="detail-hero" src="${p.image}" alt="${esc(p.name)}"><div class="pprice">${p.price}</div><p class="muted">${esc(p.place)}</p><div class="detail-grid"><div class="detail-stat"><b>${p.area}</b><span>Площадь</span></div><div class="detail-stat"><b>${p.rooms}</b><span>Планировка</span></div><div class="detail-stat"><b>${p.type}</b><span>Тип объекта</span></div></div><p style="font-size:12px">${esc(p.desc)}</p><div class="modalactions"><button class="btn" data-close>Закрыть</button><button class="btn primary" id="applyProperty" data-id="${id}">Оставить заявку ↗</button></div>`)}
function login(){let email=$('loginEmail').value.trim().toLowerCase(),pass=$('loginPassword').value;let u=db.users.find(x=>x.email===email&&x.password===pass);if(!u){toast('Проверьте email и пароль');return}db.activeUser=u.id;setRole('client');toast('Вы вошли в аккаунт')}
document.addEventListener('input',e=>{if(e.target&&['regPhone','profilePhone'].includes(e.target.id)){e.target.value=e.target.value.replace(/\D/g,'').slice(0,15)}});
document.addEventListener('click',e=>{let c=e.target.closest('[data-close]');if(c)closeModal();if(e.target.classList.contains('modalback'))closeModal();if(e.target.id==='registerOpen')registerModal();if(e.target.id==='goLogin'){closeModal();showView('clientHome')}if(e.target.id==='applyProperty'){let id=e.target.dataset.id;closeModal();createRequest(id)}if(e.target.id==='replyToClient')openManagerChat(e.target.dataset.id);let dealButton=e.target.closest('[data-approve-deal]');if(dealButton)approveDeal(dealButton.dataset.approveDeal);if(e.target.id==='confirmDeleteAccount'){let id=db.activeUser;db.users=db.users.filter(x=>x.id!==id);db.requests=db.requests.filter(x=>x.userId!==id);Object.keys(db.messages).forEach(k=>{if(!db.requests.some(r=>r.id===k))delete db.messages[k]});delete db.favorites[id];db.activeUser=null;db.activeRole='client';save();closeModal();showView('clientHome');toast('Аккаунт удалён') }});
document.addEventListener('submit',e=>{if(e.target.id==='registerForm'){e.preventDefault();let name=$('regName').value.trim(),phone=$('regPhone').value.replace(/\D/g,''),email=$('regEmail').value.trim().toLowerCase(),password=$('regPassword').value;if(!/^\d{10,15}$/.test(phone)){toast('Телефон должен содержать 10–15 цифр');return}if(!validEmail(email)){toast('Укажите корректный email на распространённом домене');return}if(db.users.some(x=>x.email===email)){toast('Этот email уже зарегистрирован');return}let u={id:'u'+Date.now(),name,phone,email,password};db.users.push(u);db.activeUser=u.id;save();closeModal();setRole('client');toast('Аккаунт создан. Добро пожаловать!')}if(e.target.id==='paymentDemoForm'){e.preventDefault();let r=[...db.requests].filter(x=>x.userId===db.activeUser).pop();if(!r)return;r.deal={status:'pending',created:new Date().toLocaleString('ru-RU'),payer:$('payerName').value.trim(),paymentMethod:$('demoPayment').value,note:$('paymentNote').value.trim()};r.dealIntent=false;r.managerRequested=true;r.managerSeen=false;addMessage(r.id,'ai','Заявка на оформление отправлена менеджеру. В CRM появилась новая сделка со статусом «Ожидает подтверждения». Это демонстрация, оплаты не было.');save();closeModal();showView('clientChat');toast('Заявка передана менеджеру')}if(e.target.id==='profileForm'){e.preventDefault();let u=user(),phone=$('profilePhone').value.replace(/\D/g,''),email=$('profileEmail').value.trim().toLowerCase();if(!/^\d{10,15}$/.test(phone)){toast('Телефон должен содержать 10–15 цифр');return}if(!validEmail(email)){toast('Укажите корректный email');return}if(db.users.some(x=>x.id!==u.id&&x.email===email)){toast('Этот email уже используется');return}u.name=$('profileName').value.trim();u.phone=phone;u.email=email;save();closeModal();showView('clientHome');toast('Профиль обновлён')}});
$('profileShortcut').addEventListener('click',()=>{if(db.activeRole==='client')showView('clientHome')});$('profileTop').addEventListener('click',()=>showView('clientHome'));
$('switchAccount').addEventListener('click',()=>{if(db.activeRole==='admin'){if(db.users.length){let u=user()||db.users[0];db.activeUser=u.id;setRole('client')}else{setRole('client');toast('Сначала зарегистрируйте покупателя')}}else{setRole('admin')}});
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
// Admin demo shortcut: allow switching to client registration even when no client exists.
function init(){if(db.activeRole==='client'&&!user()){db.activeRole='admin'}roleSync();showView(db.activeRole==='admin'?'dashboard':'clientHome')}
init();
</script>
</body></html>
